name: Publish current point clouds and mesh
on:
  push:
    branches: [main]
    paths:
      - results/**
      - processing/mesh.py
      - processing/shrinkwrap.py
      - requirements-meshing.txt
      - run_meshing.py
      - tests/**
      - processing/check_cross_row.py
      - tools/publish_result_release.py
      - .github/workflows/publish-results.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-current-results
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Open3D runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgomp1
      - name: Install meshing dependencies
        run: python -m pip install -r requirements-meshing.txt
      - name: Test cross-section geometry
        run: python -m unittest discover -s tests -v
      - name: Verify point clouds, construct mesh, and publish current downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_result_release.py

name: Run the 15-second moving lidar pilot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moving-pilot-results
  cancel-in-progress: false
jobs:
  pilot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dynamic-pilot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLCONFIGDIR: /tmp/greenspray-pilot-mpl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime libraries
        run: bash tools/install_open3d_runtime.sh
      - name: Install pinned lidar and Rhino dependencies
        run: python -m pip install -r requirements-captures.txt -r requirements-rhino.txt
      - name: Verify capture limits and coordinate transforms
        run: python -m unittest tests.test_dynamic_pilot -v
      - name: Run and publish only the bounded pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m dynamic.run_release_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moving-pilot-diagnostics
          path: /tmp/greenspray-moving-pilot/output/
          if-no-files-found: ignore
